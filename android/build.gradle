
group 'in.juspay.hyper_webview_flutter'
version '1.0-SNAPSHOT'

def props = new Properties()
file("version.properties").withInputStream { props.load(it) }
def sdkVersion = props.getProperty("sdkVersion")

buildscript {
    ext.kotlin_version = '1.7.10'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:7.3.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

// AGP 9 compiles Kotlin itself ("built-in Kotlin") and fails the build if the Kotlin Gradle
// plugin is applied too. Apply it only when the app's AGP doesn't compile Kotlin: AGP 8 and
// earlier, or AGP 9 with built-in Kotlin turned off (android.builtInKotlin=false), so apps on
// either side of AGP 9 keep building. AGP 10 removes the switch.
// See https://docs.flutter.dev/release/breaking-changes/migrate-to-built-in-kotlin
def agpMajorVersion = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0] as int
def builtInKotlinDisabled = project.findProperty('android.builtInKotlin')?.toString()?.trim() == 'false'
def usesBuiltInKotlin = agpMajorVersion >= 10 || (agpMajorVersion == 9 && !builtInKotlinDisabled)
if (!usesBuiltInKotlin) {
    apply plugin: 'kotlin-android'
}

android {
    if (project.android.hasProperty("namespace")) {
        namespace 'in.juspay.hyper_webview_flutter'
    }

    compileSdkVersion 33

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // Built-in Kotlin takes its jvmTarget from compileOptions, so this is only needed with the
    // Kotlin Gradle plugin.
    if (!usesBuiltInKotlin) {
        kotlinOptions {
            jvmTarget = '1.8'
        }
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        test.java.srcDirs += 'src/test/kotlin'
    }

    defaultConfig {
        minSdkVersion 19
    }

    // AGP 9 turns resValue support off by default. The SDK version string set in buildTypes
    // below needs it.
    buildFeatures {
        resValues true
    }

    dependencies {
        testImplementation 'org.jetbrains.kotlin:kotlin-test'
        testImplementation 'org.mockito:mockito-core:5.0.0'
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
    buildTypes.all {
        resValue 'string', 'hyper_webview_sdk_version', sdkVersion
    }
}
